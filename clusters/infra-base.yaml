# declaração de onde as coisas base do cluster vão ser versionadas pro fluxcd
# (ex: longhorn, minio, teleport, velero, traefik, cert-manager, etc)

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-base
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/dev/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
