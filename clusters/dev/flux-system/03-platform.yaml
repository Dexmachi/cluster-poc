apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 03-platform
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/dev/base/platform/traefik
  prune: true
  dependsOn:
    - name: 02-storage
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
