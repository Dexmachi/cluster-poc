apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 02-storage-operator
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/dev/base/storage/rook-ceph-operator
  prune: true
  dependsOn:
    - name: 01-governance
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
