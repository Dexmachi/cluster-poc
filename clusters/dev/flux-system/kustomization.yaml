apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  - 01-governance.yaml
  - 02-storage.yaml
  - 03-platform.yaml
  - 04-security.yaml
  - 05-apps.yaml
patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kustomize-controller
        namespace: flux-system
      spec:
        template:
          spec:
            containers:
              - name: manager
                envFrom:
                  - secretRef:
                      name: sops-security
                      optional: true
    target:
      kind: Deployment
      name: kustomize-controller
