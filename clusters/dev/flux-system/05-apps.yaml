apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 05-apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/dev/apps
  prune: true
  dependsOn:
    - name: 04-security
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
