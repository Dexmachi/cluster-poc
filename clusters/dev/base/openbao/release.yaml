apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: flux-system
spec:
  interval: 15m
  targetNamespace: openbao
  chart:
    spec:
      chart: openbao
      version: ">= 0.1.0"
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
  install:
    createNamespace: true
  values:
    server:
      dev:
        enabled: false
      dataStorage:
        enabled: true
        size: 5Gi
      standalone:
        enabled: true
        config: |
          ui = true
          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }
          storage "file" {
            path = "/openbao/data"
          }
      service:
        enabled: true
        type: NodePort
        nodePort: 30200
      ui:
        enabled: true
      ingress:
        enabled: false
